services:
  api:
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - ../:/app
    command: npm start -w @victron-ems14a/api
    environment:
      PORT: "8787"
    ports:
      - "8787:8787"
    restart: unless-stopped

  collector:
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - ../:/app
    command: npm start -w @victron-ems14a/collector
    env_file:
      - ../.env
    environment:
      COLLECTOR_INTERVAL_MS: "5000"
    restart: unless-stopped
    # Needs LAN route to Cerbo MQTT – use host network on the EMS mini-PC if needed:
    # network_mode: host
